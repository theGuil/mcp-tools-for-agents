[project]
name = "mcp-tools-for-agents"
version = "0.1.0"
description = "Servidor MCP em Python puro com tools de vídeo, áudio e arquivos para agentes de IA."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "mcp>=1.14",
    "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1"]
vision = ["opencv-python-headless>=4.10"]

[project.scripts]
mcp-tools = "server:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "mypy>=1.17",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["__main__.py", "server.py", "config.py", "core", "domains"]

[tool.hatch.build.targets.sdist]
only-include = ["__main__.py", "server.py", "config.py", "core", "domains", "tests", "README.md", ".env.example"]

[tool.uv]
python-preference = "managed"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213",          # conflitam com D211/D212
    "COM812",                # conflita com o formatter
    "FBT001", "FBT002",      # flags booleanas são parte natural da API de tools
    "PLR0913",               # tools podem ter vários parâmetros
    "S603",                  # subprocess é controlado e sem shell
    "CPY001",                # sem cabeçalho de copyright
    "TRY003", "EM101", "EM102",  # ToolError carrega mensagens longas por design
]

[tool.ruff.lint.per-file-ignores]
"domains/**" = ["TC001"]  # tipos de retorno das tools são avaliados em runtime pelo SDK
"tests/**" = ["S101", "S607", "D", "INP001", "PLR2004", "ANN401", "TC001", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["server.py", "config.py", "__main__.py", "core", "domains", "tests"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
markers = ["ffmpeg: testes que exigem o binário ffmpeg instalado"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
