# Gera o binário portátil do mcp-tools para cada plataforma e anexa à release.
#
# O GitHub só lê workflows em `.github/workflows/` na RAIZ do repositório.
# Para ativar, copie este arquivo para lá (ou mova o projeto Rust para um
# repositório próprio). Dispara em tags `rust-v*` e manualmente.
name: release-rust

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        working-directory: version-in-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # whisper.cpp (feature transcribe) precisa de cmake e de um compilador C++.
      - uses: lukka/get-cmake@latest
      - name: Build (todas as features)
        run: cargo build --release --locked --features full --target ${{ matrix.target }}
      - name: Empacotar (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mcp-tools dist/
          cp README.md .env.example dist/
          tar -C dist -czf mcp-tools-${{ matrix.target }}.tar.gz .
      - name: Empacotar (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mcp-tools.exe dist/
          Copy-Item README.md, .env.example dist/
          Compress-Archive -Path dist/* -DestinationPath mcp-tools-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: version-in-rust/mcp-tools-${{ matrix.target }}.*
