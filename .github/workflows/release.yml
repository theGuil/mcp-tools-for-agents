# Gera o binário portátil do mcp-tools para cada plataforma e publica a release.
#
# Dispara sozinho a cada push (merge) em `producao`: o job `tag` pega a última
# tag `vX.Y.Z`, incrementa o patch e cria a tag nova; o job `build` compila
# para cada plataforma e anexa `mcp-tools-<target>.tar.gz` (ou `.zip` no
# Windows) à release dessa tag. É desse anexo que `scripts/install-mcp-tools.sh`
# baixa o binário usado pelo Claude Code. Também roda manualmente.
name: release

on:
  push:
    branches: ["producao"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Criar tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular a próxima versão
        id: bump
        run: |
          last="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$last" ]; then
            next="v0.1.0"
          else
            base="${last#v}"
            major="${base%%.*}"; rest="${base#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "Última: ${last:-nenhuma}. Próxima: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Criar e enviar a tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: ${{ matrix.target }}
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # whisper.cpp (feature transcribe) precisa de cmake e de um compilador C++.
      - uses: lukka/get-cmake@latest
      - name: Build (todas as features)
        run: cargo build --release --locked --features full --target ${{ matrix.target }}
      - name: Empacotar (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mcp-tools dist/
          cp README.md .env.example dist/
          tar -C dist -czf mcp-tools-${{ matrix.target }}.tar.gz .
      - name: Empacotar (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/mcp-tools.exe dist/
          Copy-Item README.md, .env.example dist/
          Compress-Archive -Path dist/* -DestinationPath mcp-tools-${{ matrix.target }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          files: mcp-tools-${{ matrix.target }}.*
